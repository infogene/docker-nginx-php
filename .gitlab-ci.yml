include:
  - project: 'templates/ci/infogene-standard-code-scans'
    ref: main
    file: 'standard-scans.gitlab-ci.yml'

variables:
  JOB_DAST_ENABLED: 0
  JOB_SONR_ENABLED: 0
  JOB_DOJO_ENABLED: 0
  JOB_CTSN_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  # The matrix builds one image per (PHP_VERSION × OS) combination. These two
  # pick which combination owns the OS-less / floating tags:
  #   - OS_LATEST          -> the `:<php>` (no OS suffix) tags point to this OS
  #   - PHP_VERSION_LATEST -> with OS_LATEST, also owns `:latest` and the bare
  #                           `:<ref>` branch tag (the one the code-scan job pulls)
  # Both must be present in the matrix below.
  PHP_VERSION_LATEST: "8.4"
  OS_LATEST: "alpine"

# CUSTOM JOBS
docker-build:
  # Use the official docker image.
  image: docker:cli
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    DOCKER_BUILDKIT: 0
  # Serialize the matrix: only one instance of this group runs at a time, so the
  # (PHP version × OS) combinations build one after another instead of all at once.
  resource_group: docker-build
  # One job per (PHP version × OS)
  # (e.g. docker-build: [8.4, alpine], [8.4, debian], [8.5, alpine], [8.5, debian])
  parallel:
    matrix:
      - PHP_VERSION: ["8.4", "8.5"]
        OS: ["alpine", "debian"]
  before_script:
    - echo -n $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  # Per-variant branch image, e.g. :<ref>-8.4-alpine. OS-less / floating tags
  # (:<php>, :latest, bare :<ref>) are owned by OS_LATEST / PHP_VERSION_LATEST.
  script:
    - docker build --pull --build-arg "PHP_VERSION=$PHP_VERSION" -f "Dockerfile.$OS" -t "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS" .
    - docker push "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS"
    # The default OS + default PHP version also publishes the bare :<ref> branch tag
    - |
      if [ "$OS" = "$OS_LATEST" ] && [ "$PHP_VERSION" = "$PHP_VERSION_LATEST" ]; then
        docker tag "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS" "$DOCKER_IMAGE_NAME"
        docker push "$DOCKER_IMAGE_NAME"
      fi
    # Versioned + floating tags are published on a git tag, and on the monthly
    # scheduled rebuild (no git tag — the version is derived from the date, e.g.
    # v26-06-01). The scheduled rebuild uses `docker build --pull`, so it picks up
    # the latest up-to-date PHP alpine/debian base images and the security fixes
    # they ship. RELEASE is the version suffix in either case.
    - |
      RELEASE=""
      [ -n "$CI_COMMIT_TAG" ] && RELEASE="$CI_COMMIT_TAG"
      [ "$CI_PIPELINE_SOURCE" = "schedule" ] && RELEASE="v$(date -u +%y-%m-%d)"
      if [ -n "$RELEASE" ]; then
        docker tag "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS" "$CI_REGISTRY_IMAGE:$PHP_VERSION-$OS-$RELEASE"
        docker tag "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS" "$CI_REGISTRY_IMAGE:$PHP_VERSION-$OS"
        docker push "$CI_REGISTRY_IMAGE:$PHP_VERSION-$OS-$RELEASE"
        docker push "$CI_REGISTRY_IMAGE:$PHP_VERSION-$OS"
        # The default OS owns the OS-less :<php> tag, and (with the default PHP) `latest`
        if [ "$OS" = "$OS_LATEST" ]; then
          docker tag "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS" "$CI_REGISTRY_IMAGE:$PHP_VERSION"
          docker push "$CI_REGISTRY_IMAGE:$PHP_VERSION"
          if [ "$PHP_VERSION" = "$PHP_VERSION_LATEST" ]; then
            docker tag "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS" "$CI_REGISTRY_IMAGE:latest"
            docker push "$CI_REGISTRY_IMAGE:latest"
          fi
        fi
      fi
  # Run this job in a branch where a Dockerfile exists
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    # Monthly rebuild from up-to-date base images (set up via Build >
    # Pipeline schedules, cron `0 0 1 * *` on the default branch). No extra
    # CI/CD variable needed — only the default $CI_REGISTRY_* credentials.
    - if: $CI_PIPELINE_SOURCE == "schedule"

# PUSH TO GitHub Container Registry
# Mirrors the versioned images built by `docker-build` from the GitLab registry
# to ghcr.io. Runs on git tags (releases) and on the monthly scheduled rebuild.
ghcr-push:
  image: docker:cli
  stage: deploy
  services:
    - docker:dind
  needs:
    - docker-build
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    GHCR_IMAGE: ghcr.io/infogene/nginx-php
  # Serialize the matrix: only one instance of this group runs at a time
  resource_group: ghcr-push
  # One job per (PHP version × OS), mirroring each variant built by docker-build
  parallel:
    matrix:
      - PHP_VERSION: ["8.4", "8.5"]
        OS: ["alpine", "debian"]
  before_script:
    - echo -n $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - echo -n $CI_GHCR_TOKEN | docker login -u $CI_GHCR_USER --password-stdin ghcr.io
  script:
    # Pull the variant that `docker-build` pushed to the GitLab registry
    - docker pull "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS"
    # RELEASE = the git tag, or a date-based version on the monthly rebuild
    # (kept in sync with docker-build).
    - |
      RELEASE=""
      [ -n "$CI_COMMIT_TAG" ] && RELEASE="$CI_COMMIT_TAG"
      [ "$CI_PIPELINE_SOURCE" = "schedule" ] && RELEASE="v$(date -u +%y-%m-%d)"
      docker tag "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS" "$GHCR_IMAGE:$PHP_VERSION-$OS-$RELEASE"
      docker tag "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS" "$GHCR_IMAGE:$PHP_VERSION-$OS"
      docker push "$GHCR_IMAGE:$PHP_VERSION-$OS-$RELEASE"
      docker push "$GHCR_IMAGE:$PHP_VERSION-$OS"
      # The default OS owns the OS-less :<php> tag, and (with the default PHP) `latest`
      if [ "$OS" = "$OS_LATEST" ]; then
        docker tag "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS" "$GHCR_IMAGE:$PHP_VERSION"
        docker push "$GHCR_IMAGE:$PHP_VERSION"
        if [ "$PHP_VERSION" = "$PHP_VERSION_LATEST" ]; then
          docker tag "$DOCKER_IMAGE_NAME-$PHP_VERSION-$OS" "$GHCR_IMAGE:latest"
          docker push "$GHCR_IMAGE:latest"
        fi
      fi
  # Mirror to GHCR on git tags (releases) and on the monthly scheduled rebuild
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

include:
  - project: 'templates/ci/infogene-standard-code-scans'
    # Pinned: a template change reaches this pipeline only through a deliberate bump.
    ref: 2.0.0
    file:
      - 'standard-scans.gitlab-ci.yml'
      # workflow: merge requests, default branch and tags, auto-cancel; default: interruptible, retry
      - 'pipeline-defaults.gitlab-ci.yml'

variables:
  JOB_DAST_ENABLED: 0
  # SonarQube (sonar-project.properties) and DefectDojo are set up but stay off until the project defines
  # CI_SONAR_HOST_URL, CI_SONAR_PROJECT_KEY, CI_SONAR_TOKEN and CI_JOB_DOJO_URL, CI_JOB_DOJO_TOKEN,
  # CI_JOB_DOJO_PRODUCT_ID (Settings > CI/CD > Variables): then set them to 1.
  JOB_SONR_ENABLED: 0
  JOB_DOJO_ENABLED: 0
  # The variants owning the floating release tags (release-image): `:<php>` points to OS_LATEST,
  # `:latest` to OS_LATEST + PHP_VERSION_LATEST. Both must be in the `.variants` matrix.
  PHP_VERSION_LATEST: "8.4"
  OS_LATEST: "alpine"
  # Monthly rebuild: a pipeline schedule on the default branch (Build > Pipeline schedules, cron `0 0 1 * *`)
  # rebuilds the images from scratch (base images and OS packages security fixes) and releases them with a
  # date-based version (e.g. v26-06-01).
  DOCKER_PROMOTE_ON_SCHEDULE: 1

# Stages only group the jobs for display: `needs` drive the execution order.
# `test` and `dast` also host the template's disabled jobs, whose stage GitLab validates anyway.
stages:
  - lint
  - build
  - test
  - release
  - dast
  - report

# One job per (PHP version × OS) for every job handling the images
# (e.g. docker-build: [8.4, alpine], [8.4, debian], [8.5, alpine], [8.5, debian]).
# Adding a PHP version or an OS (with its Dockerfile.<os>) only takes a change here.
.variants:
  parallel:
    matrix:
      - PHP_VERSION: [ "8.4", "8.5" ]
        OS: [ "alpine", "debian" ]
  variables:
    # The template derives each variant's images from it: `:<sha>-<php>-<os>` (the commit image, scanned and
    # promoted) and `:<ref>-<php>-<os>`
    DOCKER_TAG_SUFFIX: -$PHP_VERSION-$OS

# The scripts copied into the image, and the smoke test.
shellcheck:
  stage: lint
  extends: [ .job-rules-mr-main ]
  image: koalaman/shellcheck-alpine:v0.11.0
  needs: [ ]
  script:
    - shellcheck bin/* tests/smoke-test

docker-build:
  extends: [ .docker-build, .variants ]
  needs:
    - job: shellcheck
      artifacts: false
  variables:
    DOCKER_BUILD_FILE: Dockerfile.$OS
    DOCKER_BUILD_ARGS: --build-arg PHP_VERSION=$PHP_VERSION
    # Nothing is pushed unless the image runs and serves in its documented modes
    DOCKER_BUILD_TEST_SCRIPT: sh tests/smoke-test
    # `latest` is a release tag here (release-image), not the last default branch build
    DOCKER_BUILD_TAG_LATEST: 0
    # Keep the Dockerfile's GitHub source label: it links the ghcr.io package to its repository
    DOCKER_LABEL_SOURCE: ''

# Analysis settings live in sonar-project.properties.
sonar-qube-job:
  needs: [ ]

# One scan per variant: Alpine and Debian ship different OS packages.
container-scanning-job:
  extends: [ .container-scanning, .variants ]

# Releases each variant's verified commit image, without a rebuild, on a git tag and on the monthly rebuild:
# `:<php>-<os>-<version>` and `:<php>-<os>`, plus the floating `:<php>` and `:latest`, in the GitLab registry
# and on ghcr.io.
release-image:
  stage: release
  extends: [ .docker-promote, .variants ]
  variables:
    DOCKER_PROMOTE_MIRROR_IMAGE: ghcr.io/infogene/nginx-php
    DOCKER_PROMOTE_MIRROR_USER: $CI_GHCR_USER
    DOCKER_PROMOTE_MIRROR_PASSWORD: $CI_GHCR_TOKEN
  before_script:
    - |
      DOCKER_PROMOTE_TAGS="$PHP_VERSION-$OS-{version} $PHP_VERSION-$OS"
      if [ "$OS" = "$OS_LATEST" ]; then
        DOCKER_PROMOTE_TAGS="$DOCKER_PROMOTE_TAGS $PHP_VERSION"
        if [ "$PHP_VERSION" = "$PHP_VERSION_LATEST" ]; then
          DOCKER_PROMOTE_TAGS="$DOCKER_PROMOTE_TAGS latest"
        fi
      fi

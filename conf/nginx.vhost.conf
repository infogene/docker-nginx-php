# Temp files in a single directory on both variants (Debian defaults to
# /var/lib/nginx/<type>), so a read-only root filesystem only needs a tmpfs on
# /var/lib/nginx/tmp.
client_body_temp_path /var/lib/nginx/tmp/client_body;
fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;
proxy_temp_path /var/lib/nginx/tmp/proxy;
uwsgi_temp_path /var/lib/nginx/tmp/uwsgi;
scgi_temp_path /var/lib/nginx/tmp/scgi;

# Default request body limit. The entrypoint overrides it per server from
# NGINX_CLIENT_MAX_BODY_SIZE (default: PHP_POST_MAX_SIZE), rendered in /tmp/nginx.
client_max_body_size 10M;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    root /application/public;

    include /tmp/nginx/*.conf;
    client_body_buffer_size 1M;

    # Liveness endpoint (docker-healthcheck): answered by PHP-FPM's ping, without
    # running the application
    location = /healthz {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        # try to serve file directly, fallback to index.php
        try_files $uri /index.php$is_args$args;
    }

    # Nginx will return a 404 error when files are not found instead of passing the
    # request to Symfony (improves performance but Symfony's 404 page is not displayed)
    location ~ ^/(bundles|media|packages) {
         try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Prevents URIs that include the front controller. This will 404:
        # http://domain.tld/index.php/some-path
        # Remove the internal directive to allow URIs like this
        internal;
    }

    # return 404 for all other php files not matching the front controller
    # this prevents access to other php files you don't want to be accessible.
    location ~ \.php$ {
        return 404;
    }

    #error_log /var/log/nginx/error.log;
    #access_log /var/log/nginx/access.log;

    proxy_read_timeout 60;
    proxy_connect_timeout 60;
    proxy_send_timeout 60;
    send_timeout 60;
    fastcgi_send_timeout 60;
    fastcgi_read_timeout 60;
}
; Values written ${VAR} come from environment variables: defaults are set with
; ENV in the Dockerfiles, override them at runtime (docker run -e VAR=...).

; PHP Common Configs
memory_limit = ${PHP_MEMORY_LIMIT}
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
display_errors = Off
date.timezone = ${PHP_DATE_TIMEZONE}
short_open_tag = off

; Production tweaks
post_max_size = ${PHP_POST_MAX_SIZE}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}

expose_php=0
apc.enable_cli=1
opcache.enable=1
opcache.interned_strings_buffer=16
opcache.memory_consumption=256
opcache.max_accelerated_files=50000
opcache.preload_user=www-data
realpath_cache_size=4096K
realpath_cache_ttl=600
zend.detect_unicode=0
zend.exception_ignore_args=1

; Opcache production tweaks: set PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 when the code
; never changes at runtime, and PHP_OPCACHE_PRELOAD to your preload script
; (e.g. /application/config/preload.php for Symfony)
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.preload = ${PHP_OPCACHE_PRELOAD}

; Code coverage driver: loaded but inactive unless PHP_PCOV_ENABLED=1 (e.g. in CI)
pcov.enabled = ${PHP_PCOV_ENABLED}

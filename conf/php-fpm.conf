; Loaded after the official image's docker.conf / zz-docker.conf
; (installed as /usr/local/etc/php-fpm.d/zz-nginx-php.conf)

[global]
; Graceful stop: on SIGQUIT, workers get up to this long to finish their current
; request (the default, 0, kills them immediately and drops in-flight requests).
; Keep it below the supervisor stopwaitsecs set by docker-entrypoint (25).
process_control_timeout = 20s

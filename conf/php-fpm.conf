; Loaded after the official image's docker.conf / zz-docker.conf
; (installed as /usr/local/etc/php-fpm.d/zz-nginx-php.conf)

[global]
; Graceful stop: on SIGQUIT, workers get up to this long to finish their current
; request (the default, 0, kills them immediately and drops in-flight requests).
; Keep it below the supervisor stopwaitsecs set by docker-entrypoint (25).
process_control_timeout = 20s

[www]
; Process manager, tunable at runtime with PHP_FPM_PM* environment variables
; (defaults set with ENV in the Dockerfiles). Size pm.max_children from the
; memory available to the container divided by the memory of one worker.
pm = ${PHP_FPM_PM}
pm.max_children = ${PHP_FPM_PM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_PM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_PM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_PM_MAX_REQUESTS}

; Liveness endpoint, exposed by nginx as /healthz (used by docker-healthcheck)
ping.path = /fpm-ping
ping.response = pong
access.suppress_path[] = /fpm-ping

# SonarQube analysis settings, read by sonar-scanner from the repository root (sonar-qube-job).
# Host, project key and token come from CI/CD variables (CI_SONAR_HOST_URL, CI_SONAR_PROJECT_KEY,
# CI_SONAR_TOKEN); the job is enabled with JOB_SONR_ENABLED in .gitlab-ci.yml.

sonar.sourceEncoding=UTF-8

# What goes into the image: scripts, configuration, placeholder app and the two Dockerfiles
# (`Dockerfile` is a symlink to Dockerfile.alpine, left out to avoid a duplicate analysis).
sonar.sources=bin,conf,src,Dockerfile.alpine,Dockerfile.debian
sonar.tests=tests
sonar.docker.file.patterns=Dockerfile,Dockerfile.*,*.dockerfile

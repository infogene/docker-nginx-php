# Default backend (Nginx + PHP-FPM) with the container running as root.
# Supervisor and the services then run as root; Nginx workers and PHP-FPM pool
# workers switch to www-data, hence SETUID/SETGID.
#
#   docker compose -f backend-user-root.yml up
#   -> http://localhost:8080
services:
  app:
    image: ghcr.io/infogene/nginx-php:latest
#    build:
#      context: ../..
#      dockerfile: Dockerfile.alpine
    ports:
      - "8080:8080"
    command:
      - --start-backend
    user: root
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

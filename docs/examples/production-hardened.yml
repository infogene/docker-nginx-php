# Production-hardened backend (Nginx + PHP-FPM).
#
# Layers the options you typically want in production on top of the base image:
# health checking, capability dropping, a read-only root filesystem (with the
# few writable paths exposed as tmpfs), resource limits, ulimits and log
# rotation. Verified to serve HTTP 200 with this exact configuration.
#
#   docker compose -f production-hardened.yml up
#   -> http://localhost:8080
services:
  app:
    image: ghcr.io/infogene/nginx-php:latest
    # build:
    #   context: ../..
    #   dockerfile: Dockerfile.alpine
    command:
      - --start-backend
      - --mode-prod
    ports:
      - "8080:8080"

    # Restart automatically unless the operator stopped the container on purpose
    # (also covers the fail-fast exit when a supervised program enters FATAL).
    restart: unless-stopped

    # Nginx and PHP-FPM finish in-flight requests on stop (up to 20 s): give them
    # time before Docker's SIGKILL (default: 10 s).
    stop_grace_period: 30s

    # Production PHP settings (see the README for every PHP_* variable).
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
      # ~40 MB per worker within the 512M limit below
      PHP_FPM_PM_MAX_CHILDREN: "10"

    # Liveness probe (the image's default, shown here to tune it): Nginx and
    # PHP-FPM must answer /healthz, without running the application.
    healthcheck:
      test: ["CMD", "docker-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # --- Security hardening -------------------------------------------------
    # The image already runs as the non-root user www-data (uid/gid 1000) and
    # Nginx listens on 8080 without any file capability: drop every Linux
    # capability, and forbid privilege escalation (setuid binaries, file caps).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # Read-only root filesystem. The base image only writes to a handful of
    # paths; expose those as tmpfs (mode 1777 so the www-data user can write)
    # so the rest of the filesystem stays immutable.
    read_only: true
    volumes:
      # docker-supervisor-cli writes /tmp/supervisord.conf (+ supervisor pid).
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777 }
      # nginx pid + lock file.
      - type: tmpfs
        target: /run/nginx
        tmpfs: { mode: 01777 }
      # nginx client_body / proxy / fastcgi / uwsgi / scgi temp dirs.
      - type: tmpfs
        target: /var/lib/nginx/tmp
        tmpfs: { mode: 01777 }
      # Mount your application here (otherwise the image's built-in phpinfo() is
      # served). Use :ro if your app does not write to its own source tree.
      # - type: bind
      #   source: ./
      #   target: /application
      #   read_only: true

    # --- Resource limits ----------------------------------------------------
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          # Cap the number of processes (defense against fork bombs / runaway workers).
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 128M
    # Raise the open-file limit for PHP-FPM/Nginx under load.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    # --- Logging ------------------------------------------------------------
    # Supervisor forwards each program's stdout/stderr to the container logs;
    # rotate them so they cannot fill the host disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
